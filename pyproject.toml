[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-digital-twin-platform"
version = "0.1.0"
description = "Complete original AI market digital twin platform for human-in-the-loop fund investment research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "AI-Driven Market Digital Twin Research Team" }
]
keywords = [
  "finance",
  "quantitative-research",
  "streamlit",
  "digital-twin",
  "portfolio-construction",
  "explainable-ai",
  "risk-management",
  "llm-agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "streamlit>=1.55,<2.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "scipy>=1.13,<2.0",
  "scikit-learn>=1.4,<2.0",
  "plotly>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]
agents = [
  "langgraph>=0.4.8",
  "langchain-core>=0.3.81",
  "langchain-openai>=0.3.23",
  "langchain-anthropic>=0.3.15",
  "langchain-google-genai>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/market-digital-twin-platform"
Documentation = "https://github.com/your-org/market-digital-twin-platform/tree/main/docs"
Issues = "https://github.com/your-org/market-digital-twin-platform/issues"

[project.scripts]
market-digital-twin = "market_digital_twin.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "src",
]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
